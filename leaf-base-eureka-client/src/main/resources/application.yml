spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
        group:
          enabled: false
        alphanumeric-ids:
          enabled: true

eureka:
  client:
    register-with-eureka: true
    service-url:
      defaultZone: http://eureka7001.com:7001/eureka/,http://eureka7002.com:7002/eureka/,http://eureka7003.com:7003/eureka/
