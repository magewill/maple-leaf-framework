# Eureka client example - single registry.
#
# The framework ships no registration defaults: the registry address and the
# registration flag are the application's decision. Copy the block below into
# the host application.yml (any profile specific file works as well) and point
# EUREKA_DEFAULT_ZONE at the real registry, for example
#   EUREKA_DEFAULT_ZONE=http://eureka.internal:7001/eureka/
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
