server:
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 1000
      min-spare: 30
    remoteip:
      remote-ip-header: X-Real-IP
      protocol-header: X-Forwarded-Proto
  servlet:
    context-path: /gx
  port: 8085
  forward-headers-strategy: framework

# Log4j2日志文件配置
logging:
  config: classpath:log4j2-test.xml
  level:
    root: info
    druid.sql.Statement: debug

debug: false
