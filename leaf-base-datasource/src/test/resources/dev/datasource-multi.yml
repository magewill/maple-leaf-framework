# 仅用于 MultiDataSourceIT 集成验证（双数据源）。
# 连接信息全部来自环境变量/系统属性，仓库内不保存任何真实凭据：
#   -DIT_DB_URL=jdbc:mysql://<host>:3306/test
#   -DIT_DB1_URL=jdbc:mysql://<host>:3306/test1
#   -DIT_DB_USER=<user>
#   -DIT_DB_PASSWORD=<password>
# 常规单元测试与其他集成测试不会加载该文件。
dynamic:
  datasource:
    framework:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: ${IT_DB_URL}
      username: ${IT_DB_USER}
      password: ${IT_DB_PASSWORD}
      filters: stat,wall,slf4j
      connection-properties: useSSL=false;allowPublicKeyRetrieval=true;characterEncoding=utf8;serverTimezone=UTC
    slave1:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: ${IT_DB1_URL}
      username: ${IT_DB_USER}
      password: ${IT_DB_PASSWORD}
      filters: stat,wall,slf4j
      connection-properties: useSSL=false;allowPublicKeyRetrieval=true;characterEncoding=utf8;serverTimezone=UTC
